services:
  worker:
    build: .
    ports:
      - "8000:8000"
    environment:
      MODEL: ${MODEL:-mv}          # mv | mini
      ALLOW_ORIGINS: ${ALLOW_ORIGINS:-*}
    volumes:
      - models:/models             # weights download once, then cached
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  models:
