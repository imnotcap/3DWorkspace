services:
  sam3d:
    build: .
    ports:
      - "7860:7860"
    environment:
      HF_TOKEN: ${HF_TOKEN:?set HF_TOKEN (see README)}
      ALLOW_ORIGINS: ${ALLOW_ORIGINS:-*}   # e.g. https://<user>.github.io
    volumes:
      - models:/models                     # weights download once, then cached
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  models:
