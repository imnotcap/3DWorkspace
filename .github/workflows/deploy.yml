name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # CC0 PBR textures from ambientCG; on failure the app uses procedural textures.
      - run: npm run textures
        continue-on-error: true
      # Photoreal furniture (Khronos glTF Sample Assets, CC0 / CC BY 4.0); missing ones are hidden in the catalog.
      - run: npm run models
        continue-on-error: true
      # The model library: furniture, lamps, plants and decor from Poly Haven (CC0), 1K textures, size-capped.
      - run: npm run library
        continue-on-error: true
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # The site must never contain an API key: each visitor uses their own.
      - run: npm run check:secrets
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
